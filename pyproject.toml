[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvclean"
version = "0.1.0"
description = "CSV data cleaning & validation tool (personal demo, synthetic data)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[project.scripts]
csvclean = "csvclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
